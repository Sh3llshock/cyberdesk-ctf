<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberDesk</title>
<meta name="description" content="A fake desktop where students learn cybersecurity basics through four hands-on CTF challenges.">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
  <div id="desktop">
    <div id="icons"></div>
  </div>

  <div id="taskbar">
    <div id="start" title="Start">⊞</div>
    <div id="search"><span>🔍</span><span>Type here to search</span></div>
    <div class="task-apps"></div>
    <div id="tray">
      <span title="Network">🖧</span>
      <span title="Sound">🔊</span>
      <div id="clock"></div>
    </div>
  </div>

  <div id="toasts"></div>

  <!-- core shells (order matters: OS first) -->
  <script src="js/os.js"></script>
  <script src="js/ctf.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hacker.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/terminal.js"></script>

  <!-- challenge modules (added by agents) -->
  <script src="js/apps/dogbook.js"></script>
  <script src="js/apps/grading.js"></script>
  <script src="js/apps/game.js"></script>
  <script src="js/apps/cheatengine.js"></script>
  <script src="js/apps/nmap.js"></script>
</body>
</html>
